name: CI/CD

on: [push, pull_request]


jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: 1
      POSTGRES_DB: habits
      POSTGRES_USER: habits_user
      POSTGRES_PASSWORD: habits_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    services:
      postgres:
        image: postgres:16.0
        env:
          POSTGRES_DB: habits
          POSTGRES_USER: habits_user
          POSTGRES_PASSWORD: habits_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U habits_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdir -p static
      - run: python manage.py migrate
      - run: python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
      - name: Build & push
        run: |
          docker build \
            --build-arg SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            -t "${{ secrets.DOCKER_HUB_USERNAME }}"/coursework5:"${{ github.sha }}" \
            .
          docker push "${{ secrets.DOCKER_HUB_USERNAME }}"/coursework5:"${{ github.sha }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p ~/app
            cd ~/app
            
            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }} .
            fi
            
            git fetch
            git checkout ${{ github.sha }}
            
            echo "${{ secrets.ENV_FILE }}" > .env
            
            # Остановить и удалить старые контейнеры и образы
            docker compose down --rmi all --volumes --remove-orphans
            
            # Пересобрать и запустить
            docker compose up -d --build
            # создаём .env
            echo "${{ secrets.ENV_FILE }}" > .env

            # пересобираем и запускаем
            docker compose down
            docker compose pull
            docker compose up -d --build
name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: habits
          POSTGRES_USER: habits_user
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8  # для линтинга

    - name: Run linter
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests
      env:
        SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'test-secret-key-for-ci' }}
        DEBUG: True
        ALLOWED_HOSTS: localhost,127.0.0.1
        NAME: habits
        USER: habits_user
        PASSWORD: ${{ secrets.DB_PASSWORD }}
        HOST: localhost
        PORT: 5432
        TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || 'dummy-token-for-tests' }}
        CELERY_BROKER_URL: redis://localhost:6379
        CELERY_RESULT_BACKEND: redis://localhost:6379
        CACHE_LOCATION: redis://localhost:6379/1
      run: |
        echo "SECRET_KEY=$SECRET_KEY" > .env.test
        echo "DEBUG=True" >> .env.test
        echo "TG_TOKEN=$TG_TOKEN" >> .env.test
        
        python manage.py test habits.tests
        python manage.py test users.tests

    - name: Run migrations
      env:
        SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'test-secret-key-for-ci' }}
        DEBUG: True
        NAME: habits
        USER: habits_user
        PASSWORD: ${{ secrets.DB_PASSWORD }}
        HOST: localhost
        PORT: 5432
      run: |
        python manage.py migrate

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        build-args: |
          SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          TG_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - uses: actions/checkout@v4

    - name: Create environment file for deployment
      run: |
        cat > .env.deploy << EOF
        SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
        DEBUG=False
        ALLOWED_HOSTS=localhost,127.0.0.1,147.45.246.38
        NAME=habits
        USER=habits_user
        PASSWORD=${{ secrets.DB_PASSWORD }}
        HOST=db
        PORT=5432
        TG_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
        CELERY_BROKER_URL=redis://redis:6379
        CELERY_RESULT_BACKEND=redis://redis:6379
        CACHE_LOCATION=redis://redis:6379/1
        EOF

    - name: Deploy to Production Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /root/coursework_5
          
          git fetch origin
          git reset --hard origin/main
          
          cat << 'EOF' > .env
          SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1,147.45.246.38
          NAME=habits
          USER=habits_user
          PASSWORD=${{ secrets.DB_PASSWORD }}
          HOST=db
          PORT=5432
          TG_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          CELERY_BROKER_URL=redis://redis:6379
          CELERY_RESULT_BACKEND=redis://redis:6379
          CACHE_LOCATION=redis://redis:6379/1
          EOF
          
          docker-compose down
          
          docker-compose up -d --build
          
          docker-compose exec -T web python manage.py migrate --noinput
          
          docker-compose exec -T web python manage.py collectstatic --noinput
          
          docker-compose restart celery_worker celery_beat telegram_bot
          
          docker image prune -f
          
          docker-compose ps
          echo "✅ Деплой успешно завершен!"